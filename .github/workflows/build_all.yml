name: PS2 build

on:
  push:
    branches: [ master, ps2-port ]
    paths: [ 'ps2/**', 'Dockerfile', '.github/workflows/ps2.yml', 'build.sh' ]
  pull_request:
    paths: [ 'ps2/**', 'build.sh' ]
  workflow_dispatch:

jobs:
  ps2-elf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      # Build using a preset (e.g., 'stable' for gsKit video, or just run whatever target fits)
      - name: Build PS2 ELFs via build.sh
        run: ./build.sh stable EMBED_WAD=0

      - name: Upload ELFs
        uses: actions/upload-artifact@v4
        with:
          name: ps2-elf-artifact
          path: |
            bin/ps2oom.elf
          if-no-files-found: error
